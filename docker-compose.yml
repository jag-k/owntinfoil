services:
  own-tinfoil:
    image: ghcr.io/jag-k/owntinfoil:latest
    container_name: own-tinfoil
    volumes:
      - ./NPSdir:/nps
      - ./TORRENTdir:/torrents
    ports:
      - "8080:8080"
    # Load shop authentication and other optional settings from .env.
    env_file:
      - path: .env
        required: false
    environment:
      - BOT_KEY=${BOT_KEY:-} # optional; enable bot sync together with BOT_URL
      - BOT_URL=${BOT_URL:-}
    restart: unless-stopped

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - TRANSMISSION_WEB_HOME= #optional
      # - HOST_WHITELIST= #optional
      - USER= #optional
      - PASS= #optional
      - WHITELIST= #optional
      - PEERPORT= #optional
    volumes:
      - ./NPSdir:/downloads/complete
      - ./TORRENTdir:/watch
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    restart: unless-stopped
