[project]
name = "owntinfoil"
version = "0.2.1"
description = "OwnTinfoil HTTP shop and optional bot synchronization"
requires-python = ">=3.12"
authors = [{name = "jag-k", email = "me@jagk.dev"}]
maintainers = [{name = "jag-k", email = "me@jagk.dev"}]
license = "MIT"
readme = "README.md"
keywords = ["tinfoil", "owntinfoil", "nintendo-switch"]
dependencies = [
    "aiofile>=3.12.3",
    "aiohttp>=3.14.5",
    "aiohttp-basicauth>=1.2.0",
    "pydantic-settings>=2.16.1",
]

[project.urls]
Homepage = "https://github.com/jag-k/owntinfoil"
Repository = "https://github.com/jag-k/owntinfoil"
Documentation = "https://github.com/jag-k/owntinfoil/wiki"

[dependency-groups]
dev = [
    "prek>=0.5.7",
    "pydantic-settings-export>=1.1.3",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
select = [
    "F", # pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "YTT", # flake8-2020
    # "ANN", # flake8-annotations
    "ASYNC", # flake8-async
    "ASYNC1", # trio
    "S", # flake8-bandit
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "COM", # flake8-commas
    "C4", # flake8-comprehensions
    "ICN", # flake8-import-conventions
    "G", # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "PYI", # flake8-pyi
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TC", # flake8-type-checking
    "INT", # flake8-gettext
    "PTH", # flake8-use-pathlib
    "TD", # flake8-todos
    "ERA", # eradicate
    "PGH", # pygrep-hooks
    "PL", # PyLint
    "FLY", # flynt
    "PERF", # Perflint

    "RUF", # ruff
]
ignore = ["line-too-long", "missing-trailing-comma"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["magic-value-comparison", "unused-async"]

# Generate configuration documentation from the class, never from the runtime instance.
[tool.pydantic_settings_export]
project_dir = "."
root_dir = "."
default_settings = ["app.config:Settings"]
venv = "auto"

[tool.pydantic_settings_export.relative_to]
replace_abs_paths = true
alias = "."

[[tool.pydantic_settings_export.generators.markdown]]
paths = ["docs/configuration.md"]

[[tool.pydantic_settings_export.generators.dotenv]]
paths = [".env.example"]
add_examples = true
