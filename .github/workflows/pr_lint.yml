name: PR Validation

on:
  pull_request:

jobs:
  validate-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Check labels
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # language=JavaScript
          script: |
            const {
              data: pullRequest
            } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const labels = pullRequest.labels.map(label => label.name);
            const invalidLabels = ['feature request', 'invalid', 'question'];
            const hasInvalidLabel = labels.some(label => invalidLabels.includes(label));

            if (labels.length === 0) {
              core.setFailed('Pull request must have at least one label!');
            }

            if (hasInvalidLabel) {
              core.setFailed('Pull request must have an invalid label: ' + invalidLabels.join(', '));
            }

      - name: Check assignees
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # language=JavaScript
          script: |
            const {
              data: pullRequest
            } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            if (pullRequest.assignees.length === 0) {
              core.setFailed('Pull request must have an assignee');
            }

      - name: Check draft status
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # language=JavaScript
          script: |
            const {
              data: pullRequest
            } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            if (pullRequest.draft) {
              core.setFailed('Pull request must not be a draft');
            }

  validate-code:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run --locked ruff check --output-format=github .

      - name: Run ty
        run: uv run --locked ty check

      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Run prek hooks
        run: uv run --locked prek run --all-files --show-diff-on-failure

      - name: Get version from pyproject.toml
        id: get_version
        run: |
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

  validate-branch:
    runs-on: ubuntu-latest
    needs:
      - validate-code
    if: startsWith(github.head_ref, 'release/')
    steps:
      - name: Check branch name with version
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          RELEASE_VERSION: ${{ needs.validate-code.outputs.version }}
        run: |
          # Extract the branch name from the GitHub context
          branch_name="$BRANCH_NAME"

          # Check if the branch name starts with "release/" and does not match the version
          if [[ $branch_name == release/* && $branch_name != "release/$RELEASE_VERSION" ]]; then
            echo "Branch name does not match the version in pyproject.toml"
            exit 1
          fi

  validate-docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      packages: read
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            type=sha,prefix=,suffix=,format=short

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.platform }}-

      - name: Build Docker image for ${{ matrix.platform }}
        uses: docker/build-push-action@v7
        id: build-and-push
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          platforms: ${{ matrix.platform }}
